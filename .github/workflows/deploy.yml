name: Deploy to GitHub Pages

on:
  push:
    # Pages hosts one site, so whichever branch pushes last is what is live.
    # The critic-loop branch is listed alongside the default one so the work in
    # flight can actually be flown, rather than only being reviewable as stills
    # in shots/critique. Drop it from this list once the branch merges.
    branches:
      - claude/aaa-3d-universe-threejs-rzckv5
      - claude/workflows-continuation-y4ys11
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
